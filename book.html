<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Details</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script>
        $(document).ready(function() {
        var sp = window.location.search;
        var trim = sp.slice(4);
        var jsonUrl = 'https://openlibrary.org/' + trim + '.json';
        console.log(jsonUrl);
        var bookInfo = $('#bookInfo');
        var subjects = []
        $.ajax({
            url: jsonUrl,
            method: 'GET',
            dataType: 'json',
            success: function(data) {
                console.log(data);
                var cover = "https://covers.openlibrary.org/b/id/" + data.covers[0] + "-L.jpg";
                console.log(cover);
                var authorInfo = "https://openlibrary.org/" + data.authors[0].author.key + ".json";
                console.log(authorInfo);
                subjects = data.subjects
                console.log(subjects)
                $.getJSON(authorInfo, function(authorData) {
                    var authorName = authorData.personal_name;
                    console.log(authorName);
                    bookInfo.append(
                        '<li><strong>Title:</strong> ' + data.title + '</li>' +
                        '<li><strong>Author:</strong> ' + authorName + '</li>' +
                        '<li><strong>Cover Image</strong>: <br><img src="' + cover + '" alt="Cover Image"></li>' +
                        '<li><strong>Description:</strong> ' + data.description.value + '</li>'
                    );
                });
                for (var i = 0; i < 10; i++) {
                        $('#bookSubjects').append('<li>' + subjects[i] + '</li>');
                    };
                $('#link').append('https://openlibrary.org/' + trim )
            },
            error: function() {
                $('#bookInfo').html('<p>Error fetching book information.</p>');
            }
        });
    });
    
    </script>
</head>
