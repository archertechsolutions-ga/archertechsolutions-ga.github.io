<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lab 4</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script>
        $(document).ready(function() {
            var sp = window.location.search;
            var params = new URLSearchParams(sp);
            var albumId = params.get('id');
            var jsonUrl = 'https://jsonplaceholder.typicode.com/photos/' + albumId

            var albumInfo = $('#albumInfo');
            $.ajax({
                url: jsonUrl,
                method: 'GET',
                dataType: 'json',
                success: function(data) {
                    albumInfo.append('<h2>Album Details</h2>' +
                        '<p><strong>Album ID:</strong> ' + data.id + '</p>' +
                        '<p><strong>Title:</strong> ' + data.title + '</p>' +
                        '<p><strong>Album Art</strong>: <br><img src="' + data.thumbnailUrl + '" alt="Album Art"></p>');
                },
                error: function() {
                    $('#albumInfo').html('<p>Error fetching album information.</p>');
                }
            });
        });
    
    </script>
</head>
