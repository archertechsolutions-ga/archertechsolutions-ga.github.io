<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>lab 4</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script>
        $(document).ready(function() {
            var jsonUrl = 'https://jsonplaceholder.typicode.com/users/1';
            $.ajax({
                url: jsonUrl,
                method: 'GET',
                dataType: 'json',
                success: function(data) {
                    $('#userInfo').html('<h2>User Information</h2>' +
                        '<p><strong>Name:</strong> ' + data.name + '</p>' +
                        '<p><strong>Username:</strong> ' + data.username + '</p>' +
                        '<p><strong>Email:</strong> ' + data.email + '</p>' +
                        '<p><strong>Address:</strong> ' + data.address.street + ', ' + data.address.suite + ', ' + data.address.city + ', ' + data.address.zipcode + '</p>' +
                        '<p><strong>Phone:</strong> ' + data.phone + '</p>' +
                        '<p><strong>Website:</strong> <a href="http://' + data.website + '" target="_blank">' + data.website + '</a></p>' +
                        '<p><strong>Company:</strong> ' + data.company.name + '</p>');
                },
                error: function() {
                    $('#userInfo').html('<p>Error fetching user information.</p>');
                }
            });
            var jsonUrl1 = 'https://jsonplaceholder.typicode.com/albums?userId=1';
            var albumInfo = $('#albumInfo');
            $.ajax({
                url: jsonUrl1,
                method: 'GET',
                dataType: 'json',
                success: function(data) {
                    $.each(data, function(i, album) {
                        let albumUrl = `album.html?id=${encodeURIComponent(album.id)}`;     
                        albumInfo.append('<li><a href="' + albumUrl + '">' + album.title + '</a></li>');
                    });
                },
                error: function() {
                    $('#albumInfo').html('<p>Error fetching album information.</p>');
                }
            });
        });
    
    </script>
</head>
